# Tests à chaque push et pull request.
name: Tests

on:
  push:
    branches: [main]
  # PR vers main seulement : les PR vers une branche de groupe ou de jalon ne lancent rien
  # (mode de CI, CLAUDE.md).
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    # Le dépôt modèle n'a pas d'app à tester : ses garde-fous sont testés par modele.yml.
    if: github.repository != 'une-app-par-mois/app-template'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - name: Installer les dépendances (lockfile exact)
        run: npm ci
      - name: Lancer les tests
        run: ./scripts/test.sh
