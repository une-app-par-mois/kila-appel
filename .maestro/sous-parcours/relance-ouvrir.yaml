# Sous-parcours (ticket 030) : depuis l'accueil ou Bienvenue, ouvre le réglage de la relance par
# Paramètres ; la ligne « Relance, Désactivée » prouve que la relance est éteinte (appli vierge).
appId: com.jitavision.kila
---
- tapOn: 'Paramètres'
- scrollUntilVisible:
    element: 'Relance, Désactivée'
- tapOn: 'Relance, Désactivée'
- extendedWaitUntil:
    visible: 'Me relancer si l’appel n’est pas fait'
    timeout: 5000
