# Sous-parcours (ticket 016) : dans le sélecteur de fichiers du système (DocumentsUI d'Android),
# ouvre Téléchargements et choisit la sauvegarde fictive que scripts/e2e.sh y a déposée.
# Écran du système : libellés de l'émulateur en anglais (« Show roots », « Downloads »).
appId: com.jitavision.kila
---
- extendedWaitUntil:
    visible:
      id: 'com.google.android.documentsui:id/header_title'
    timeout: 10000
- tapOn: 'Show roots'
# Le tiroir des emplacements s'ouvre avec une animation : attendre qu'il soit posé.
- extendedWaitUntil:
    visible:
      id: 'com.google.android.documentsui:id/roots_list'
    timeout: 5000
- waitForAnimationToEnd
- tapOn:
    text: 'Downloads'
    childOf:
      id: 'com.google.android.documentsui:id/roots_list'
- extendedWaitUntil:
    visible: 'kila-e2e-sauvegarde-fictive\.db'
    timeout: 10000
- tapOn: 'kila-e2e-sauvegarde-fictive\.db'
