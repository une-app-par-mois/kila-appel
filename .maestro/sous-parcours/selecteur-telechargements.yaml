# Sous-parcours (tickets 016 et 030) : dans le sélecteur de fichiers du système (DocumentsUI
# d'Android), ouvre Téléchargements et choisit une sauvegarde fictive que scripts/e2e.sh y a
# déposée. Paramètre FICHIER (runFlow, env) : nom du fichier ; par défaut, celle du jalon 1. Un
# `env` d'en-tête écraserait la valeur passée par runFlow (Maestro 2.12) : défaut posé en script.
# Écran du système : libellés en anglais ou en français ; DocumentsUI de Google ou d'AOSP.
appId: com.jitavision.kila
---
- evalScript: >-
    ${output.backupFile = typeof FICHIER === 'undefined'
    ? 'kila-e2e-sauvegarde-fictive.db' : FICHIER}
- extendedWaitUntil:
    visible:
      id: 'com\.(google\.)?android\.documentsui:id/header_title'
    timeout: 10000
- tapOn: 'Show roots|Afficher les (répertoires )?racines'
# Le tiroir des emplacements s'ouvre avec une animation : attendre qu'il soit posé.
- extendedWaitUntil:
    visible:
      id: 'com\.(google\.)?android\.documentsui:id/roots_list'
    timeout: 5000
- waitForAnimationToEnd
- tapOn:
    text: 'Downloads|Téléchargements'
    childOf:
      id: 'com\.(google\.)?android\.documentsui:id/roots_list'
# Le nom est lu comme une expression régulière : un point y vaut n'importe quel caractère.
- extendedWaitUntil:
    visible: ${output.backupFile}
    timeout: 10000
- tapOn: ${output.backupFile}
