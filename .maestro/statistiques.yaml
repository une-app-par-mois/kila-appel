# Statistiques (ticket 030, EX-27, RM-01) : le jeu fictif du 023 (`statsSeed`, sauvegarde
# `kila-e2e-statistiques.db`), dont les taux ont été recalculés à la main ; ils sont écrits ici en
# clair, période « Saison » seulement. « % » suit une espace insécable (U+00A0, `NBSP` de
# src/domain/attendanceRate.ts) : chaînes entre guillemets doubles, avec l'échappement \u00a0.
# Vérifie aussi que le retour ne rouvre pas l'écran Période (`dismissTo`, ticket 024).
appId: com.jitavision.kila
---
- runFlow:
    file: sous-parcours/restaurer.yaml
    env:
      FICHIER: 'kila-e2e-statistiques.db'
      RESUME: '8 membres · 5 groupes · 22 séances'

- tapOn: 'Stats'
- extendedWaitUntil:
    visible: 'Saison'
    timeout: 10000
- tapOn: 'Saison'
# Saison : 21 séances, 47 présences comptées sur 54, soit 87 %. Le texte entier doit
# correspondre : « 87 % » seul n'est que le taux de la synthèse (les lignes ont le nom du groupe).
- extendedWaitUntil:
    visible: 'Du 01/09/2026 au \d\d/\d\d/\d{4}'
    timeout: 5000
- assertVisible: "87\u00a0%"
- assertVisible: '21'
# Lignes des groupes sous la synthèse : hors de l'écran sur un petit téléphone.
- scrollUntilVisible:
    element: "Benjamins, 78\u00a0%, .*"
- scrollUntilVisible:
    element: "Poussins, 88\u00a0%, .*"

# Groupe Poussins, puis Hugo Moreau : 64 %.
- tapOn: "Poussins, 88\u00a0%, .*"
- extendedWaitUntil:
    visible: "Hugo Moreau, 64\u00a0%"
    timeout: 5000
- tapOn: "Hugo Moreau, 64\u00a0%"
- extendedWaitUntil:
    visible:
      text: "64\u00a0%"
      id: 'member-rate'
    timeout: 5000
- assertVisible: 'Hugo Moreau'

# Écran Période : « Appliquer » referme l'écran ; un retour ne le rouvre pas.
- back
- back
# L'onglet garde sa position, en bas de la liste des groupes.
- scrollUntilVisible:
    element: 'Dates…'
    direction: UP
- tapOn: 'Dates…'
- extendedWaitUntil:
    visible: 'Appliquer'
    timeout: 5000
- tapOn: 'Appliquer'
- extendedWaitUntil:
    visible: 'Du 01/09/2026 au \d\d/\d\d/\d{4}'
    timeout: 5000
- assertNotVisible: 'Appliquer'
- back
- assertNotVisible: 'Appliquer'
- assertNotVisible: 'Période'
- assertVisible: 'Stats'
